# The whole canvas end-to-end set (fast and @slow tests) against the real binary.
# Pull requests run only the smoke subset, which keeps their pipeline short.
name: Canvas nightly e2e

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.26.10"

permissions:
  contents: read

jobs:
  e2e:
    name: "Canvas e2e (all)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      STREAMSIM_BIN: ${{ github.workspace }}/bin/streams-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: canvas/package-lock.json

      - name: Install dependencies and browser
        working-directory: canvas
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Build the binary and the canvas
        run: |
          make build
          cd canvas && npm run build

      - name: All end-to-end tests
        working-directory: canvas
        run: npm run e2e:all
